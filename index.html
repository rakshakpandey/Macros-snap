<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <title>MacroSnap India</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #090d16; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 95px; }
    .header { padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; position: sticky; top: 0; background: #090d16ee; backdrop-filter: blur(8px); z-index: 20; }
    .brand { font-size: 1.15rem; font-weight: 800; }
    .badge { background: #f97316; font-size: 0.65rem; padding: 2px 6px; border-radius: 6px; }
    .btn-small { background: #131926; border: 1px solid #232d42; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
    .container { padding: 16px; max-width: 500px; margin: auto; }
    .card { background: #131926; border: 1px solid #232d42; border-radius: 18px; padding: 16px; margin-bottom: 12px; }
    .cal-title { font-size: 0.72rem; color: #94a3b8; font-weight: 700; }
    .cal-num { font-size: 2.4rem; font-weight: 800; margin: 4px 0; color: #10b981; }
    .macro-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .m-pill { background: #1b2336; border: 1px solid #28334d; border-radius: 12px; padding: 10px 8px; text-align: center; }
    .m-label { font-size: 0.65rem; font-weight: 800; color: #94a3b8; }
    .m-val { font-size: 0.95rem; font-weight: 800; margin-top: 4px; }
    .fab-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 68px; height: 68px; background: #10b981; border-radius: 50%; border: 4px solid #090d16; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; box-shadow: 0 8px 24px rgba(16,185,129,0.4); z-index: 40; cursor: pointer; }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); display: none; align-items: flex-end; z-index: 100; }
    .sheet.active { display: flex; }
    .sheet-box { background: #131926; border-top: 1px solid #232d42; border-radius: 24px 24px 0 0; width: 100%; max-height: 85vh; padding: 20px; overflow-y: auto; }
    .input { width: 100%; background: #090d16; border: 1px solid #232d42; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-family: inherit; }
    .btn-action { width: 100%; background: #10b981; color: #000; padding: 14px; border-radius: 12px; font-weight: 800; border: none; font-size: 1rem; margin-top: 10px; cursor: pointer; }
    .disclaimer { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; font-size: 0.72rem; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; line-height: 1.4; }
    .item-card { background: #090d16; padding: 12px; border-radius: 12px; border: 1px solid #1f293d; margin-bottom: 10px; }
    .conf-tag { font-size: 0.65rem; font-weight: 800; color: #10b981; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">⚡ MacroSnap <span class="badge">IND</span></div>
    <div>
      <button class="btn-small" onclick="setupKey()">🔑 API Key</button>
      <button class="btn-small" onclick="editGoals()">🎯 Goals</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="cal-title">REMAINING CALORIES TODAY</div>
      <div class="cal-num" id="rem-cal">2,450</div>
      <div style="font-size: 0.8rem; color:#94a3b8;">Target: <strong id="t-cal" style="color:#fff">2450</strong> | Eaten: <strong id="e-cal" style="color:#fff">0</strong> kcal</div>
    </div>

    <div class="macro-row">
      <div class="m-pill"><div class="m-label" style="color:#38bdf8">PROTEIN</div><div class="m-val" id="p-val">0/155g</div></div>
      <div class="m-pill"><div class="m-label" style="color:#fbbf24">CARBS</div><div class="m-val" id="c-val">0/280g</div></div>
      <div class="m-pill"><div class="m-label" style="color:#f87171">FAT</div><div class="m-val" id="f-val">0/70g</div></div>
    </div>

    <h3 style="margin: 16px 0 10px; font-size: 1rem;">Today's Meals</h3>
    <div id="meal-list"></div>
  </div>

  <div class="fab-btn" onclick="triggerCamera()">📸</div>
  <input type="file" id="img-input" accept="image/*" capture="environment" style="display:none" onchange="processImage(event)">

  <!-- Edit Confirmation Sheet -->
  <div class="sheet" id="modal-confirm">
    <div class="sheet-box">
      <h3 style="margin-bottom: 4px;">Review Meal Breakdown</h3>
      <div class="disclaimer">⚠️ AI visual estimate only. Cooking oil and exact weights cannot be determined from photos alone. Edit items below before saving.</div>
      <label style="font-size:0.75rem; color:#94a3b8;">Meal Name</label>
      <input type="text" id="m-name" class="input">
      <div id="edit-items-box"></div>
      <button class="btn-action" onclick="saveMeal()">Save to Food Diary</button>
      <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#94a3b8; padding:12px; font-weight:700; cursor:pointer;">Cancel</button>
    </div>
  </div>

  <script>
    const todayKey = 'macrosnap_meals_' + new Date().toISOString().slice(0, 10);
    let targets = JSON.parse(localStorage.getItem('macrosnap_targets') || '{"cal":2450,"p":155,"c":280,"f":70}');
    let meals = JSON.parse(localStorage.getItem(todayKey) || '[]');
    let pendingItems = [];

    function setupKey() {
      const existing = localStorage.getItem('gemini_api_key') || '';
      const key = prompt('Enter your free Gemini API Key from Google AI Studio:', existing);
      if (key !== null && key.trim() !== '') {
        localStorage.setItem('gemini_api_key', key.trim());
        alert('API Key saved successfully!');
      }
    }

    function editGoals() {
      const c = prompt('Daily Calories Goal (kcal):', targets.cal);
      const p = prompt('Daily Protein Goal (g):', targets.p);
      const cb = prompt('Daily Carbs Goal (g):', targets.c);
      const f = prompt('Daily Fat Goal (g):', targets.f);
      if (c && p && cb && f) {
        targets = { cal: Number(c), p: Number(p), c: Number(cb), f: Number(f) };
        localStorage.setItem('macrosnap_targets', JSON.stringify(targets));
        render();
      }
    }

    function render() {
      const eaten = meals.reduce((acc, m) => {
        acc.cal += Number(m.calories || 0);
        acc.p += Number(m.protein || 0);
        acc.c += Number(m.carbs || 0);
        acc.f += Number(m.fat || 0);
        return acc;
      }, { cal: 0, p: 0, c: 0, f: 0 });

      document.getElementById('rem-cal').textContent = Math.max(0, targets.cal - eaten.cal).toLocaleString();
      document.getElementById('t-cal').textContent = targets.cal.toLocaleString();
      document.getElementById('e-cal').textContent = eaten.cal.toLocaleString();
      document.getElementById('p-val').textContent = eaten.p.toFixed(0) + '/' + targets.p + 'g';
      document.getElementById('c-val').textContent = eaten.c.toFixed(0) + '/' + targets.c + 'g';
      document.getElementById('f-val').textContent = eaten.f.toFixed(0) + '/' + targets.f + 'g';

      const list = document.getElementById('meal-list');
      if (meals.length === 0) {
        list.innerHTML = '<div style="color:#64748b; font-size:0.85rem; padding:12px 0;">No meals logged today yet. Tap 📸 to snap your meal.</div>';
        return;
      }
      list.innerHTML = '';
      meals.forEach((m, idx) => {
        list.innerHTML += `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <strong>${m.name}</strong><br>
              <span style="font-size:0.75rem; color:#94a3b8;">
                ${m.calories} kcal • P:${m.protein}g C:${m.carbs}g F:${m.fat}g
              </span>
            </div>
            <button onclick="delMeal(${idx})" style="background:none; border:none; color:#ef4444; font-weight:700; cursor:pointer;">Delete</button>
          </div>
        `;
      });
    }

    function triggerCamera() {
      const key = localStorage.getItem('gemini_api_key');
      if (!key) {
        setupKey();
        return;
      }
      document.getElementById('img-input').click();
    }

    async function processImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      const reader = new FileReader();

      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        alert('Analyzing meal with Gemini AI... Please wait ~4 seconds.');

        const promptText = `Analyze this meal image. Identify Indian & global foods (roti, dal, rice, sabzi, curries, chicken, eggs, dosa, etc.). Return conservative estimations. Output ONLY raw JSON matching this structure:
{
  "meal_name_suggestion": "e.g. Lunch: Dal, Rice & 2 Rotis",
  "items": [
    {
      "food_name": "Roti",
      "portion_g": 60,
      "confidence": "high",
      "calories": 160,
      "protein": 5.4,
      "carbs": 33.0,
      "fat": 1.2
    }
  ]
}`;

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inlineData: { mimeType: file.type || "image/jpeg", data: base64Data } }
                ]
              }],
              generationConfig: { temperature: 0.2, responseMimeType: "application/json" }
            })
          });

          if (!res.ok) throw new Error(await res.text());
          const resData = await res.json();
          const clean = resData.candidates[0].content.parts[0].text.replace(/\`\`\`json/g, '').replace(/\`\`\`/g, '').trim();
          const parsed = JSON.parse(clean);

          document.getElementById('m-name').value = parsed.meal_name_suggestion || 'Meal';
          pendingItems = parsed.items || [];
          renderEditItems();
          document.getElementById('modal-confirm').classList.add('active');
        } catch (err) {
          alert('AI Analysis notice: ' + err.message);
        }
      };

      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function renderEditItems() {
      const box = document.getElementById('edit-items-box');
      box.innerHTML = '';
      pendingItems.forEach((it, idx) => {
        box.innerHTML += `
          <div class="item-card">
            <div class="conf-tag">${(it.confidence || 'medium').toUpperCase()} CONFIDENCE</div>
            <input type="text" value="${it.food_name}" class="input" onchange="pendingItems[${idx}].food_name = this.value">
            <div style="display:flex; gap:8px;">
              <input type="number" value="${it.portion_g}" placeholder="Grams" class="input" onchange="pendingItems[${idx}].portion_g = Number(this.value)">
              <input type="number" value="${it.calories}" placeholder="Calories" class="input" onchange="pendingItems[${idx}].calories = Number(this.value)">
            </div>
          </div>
        `;
      });
    }

    function saveMeal() {
      const totalCal = pendingItems.reduce((s, i) => s + Number(i.calories || 0), 0);
      const totalP = +pendingItems.reduce((s, i) => s + Number(i.protein || 0), 0).toFixed(1);
      const totalC = +pendingItems.reduce((s, i) => s + Number(i.carbs || 0), 0).toFixed(1);
      const totalF = +pendingItems.reduce((s, i) => s + Number(i.fat || 0), 0).toFixed(1);

      meals.push({
        name: document.getElementById('m-name').value || 'Meal',
        calories: totalCal,
        protein: totalP,
        carbs: totalC,
        fat: totalF
      });

      localStorage.setItem(todayKey, JSON.stringify(meals));
      closeModal();
      render();
    }

    function delMeal(idx) {
      if (!confirm('Delete this meal?')) return;
      meals.splice(idx, 1);
      localStorage.setItem(todayKey, JSON.stringify(meals));
      render();
    }

    function closeModal() {
      document.getElementById('modal-confirm').classList.remove('active');
    }

    render();
  </script>
</body>
</html>
